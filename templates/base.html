<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Private Tours in El Salvador{% endblock %}</title>

<meta name="description" content="{% block description %}Explore El Salvador with private tours, volcano hikes, beaches and more. Safe and personalized experiences.{% endblock %}">

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>

<!-- TOP BAR -->
<header class="main-header">
    <div class="header-left">
        Hiking El Salvador
    </div>

    <nav class="main-nav">
        <a href="/">Home</a>
        <a href="/tours">Tours</a>
        <a href="/calendar">Availability</a>
        <a href="/gallery">Gallery</a>
    </nav>
<div class="cart-icon">
    <a href="/cart">
        🛒 <span id="cartCount">0</span>
    </a>
</div>

</header>
<!-- PAGE CONTENT -->
<main>
    {% block content %}{% endblock %}
</main>

<!-- FOOTER -->
<footer class="main-footer">
    <p>© 2026 Hiking El Salvador · El Salvador</p>
    <p>
        <a href="https://wa.me/50361116916" target="_blank">
            📲 Book via WhatsApp
        </a>
    </p>
</footer>
<script>
function updateCartCount(){
    const cart = JSON.parse(sessionStorage.getItem("cart") || "[]");
    const el = document.getElementById("cartCount");
    if(el) el.innerText = cart.length;
}
updateCartCount();
</script>

</body>
</html>
