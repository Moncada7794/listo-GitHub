{% extends "base.html" %}
{% block content %}

<section class="tours-page">

    <h1 class="tours-hero-title">All Tours in El Salvador</h1>

    <div class="tours-grid">

        {% for tour in tours %}
        <article class="tour-card">

            <div class="tour-img"
                 style="background-image:url('{{ url_for('static', filename='images/' ~ tour.image) }}')">
            </div>

            <div class="tour-info">
                <h2>{{ tour.name }}</h2>

                <p class="tour-meta">
                    ⏱ {{ tour.duration or "Full day" }} · 🚐 Pickup included
                </p>

                <p class="tour-price">
                    From ${{ tour.price }} USD
                </p>

                <a href="/tours/{{ tour.id }}" class="tour-btn">
                    View details
                </a>
            </div>

        </article>
        {% endfor %}

    </div>

</section>

{% endblock %}
