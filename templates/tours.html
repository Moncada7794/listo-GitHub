{% extends "base.html" %}
{% block content %}

<section class="tours-section">

    <h1 class="tours-title">All Tours in El Salvador</h1>

    <div class="tours-grid">
        {% for tour in tours %}
        <article class="tour-card">

            <div class="tour-image"
                 style="background-image:url('{{ url_for('static', filename='images/' ~ tour.image) }}')">
            </div>

            <div class="tour-content">
                <h3 class="tour-name">{{ tour.name }}</h3>

                <p class="tour-price">
                    From ${{ tour.pricing.one }} USD
                </p>

                <a href="/tours/{{ tour.id }}" class="tour-btn">
                    View details
                </a>
            </div>

        </article>
        {% endfor %}
    </div>

</section>

{% endblock %}
